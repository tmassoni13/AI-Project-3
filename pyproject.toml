[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "connect4-search-vs-rl"
version = "0.1.0"
description = "CPSC 460/560 Connect Four adversarial-agent project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
experiment = ["matplotlib>=3.8"]

[project.scripts]
connect4-train = "connect4_ai.train:main"
connect4-play = "connect4_ai.play:main"
connect4-experiment = "connect4_ai.experiment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

